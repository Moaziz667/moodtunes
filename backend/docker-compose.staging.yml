version: "3.8"

services:
  backend:
    image: azizhk444/nodejserver:${IMAGE_TAG:-latest}
    container_name: tasktodo_backend_staging
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      MONGODB_URI: ${MONGODB_URI}  # Atlas connection string from CI/CD
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
