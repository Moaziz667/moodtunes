image: docker:latest

services:
  - docker:dind

stages:
  - build_flutter_android
  - test
  - build_node
  - deploy
  - publish_pages     # add new stage for pages deploy

variables:
  DOCKER_HOST: tcp://docker:2375
  DOCKER_TLS_CERTDIR: ""
  BACKEND_IMAGE: azizhk444/nodejserver

build_flutter_apk:
  stage: build_flutter_android
  image: ghcr.io/cirruslabs/flutter:3.32.6
  script:
    - cd tasktodo_frontend
    - flutter pub get
    - flutter build apk --release
    - APK_VERSION="v${CI_PIPELINE_IID}"
    - mv build/app/outputs/flutter-apk/app-release.apk app-$APK_VERSION.apk
    - mkdir -p public/apks
    - mv app-$APK_VERSION.apk public/apks/
    # Generate or update index.html with all APKs
    - |
      echo "<!DOCTYPE html><html><head><title>APK Downloads</title></head><body><h1>APK Versions</h1><ul>" > public/index.html
      for apk in public/apks/app-*.apk; do
        echo "<li><a href='apks/$(basename $apk)'>$(basename $apk)</a></li>" >> public/index.html
      done
      echo "</ul></body></html>" >> public/index.html
  artifacts:
    paths:
      - tasktodo_frontend/public
  only:
    - main

flutter_test:
  stage: test
  image: ghcr.io/cirruslabs/flutter:3.32.6
  tags:
    - my-vps
  script:
    - cd tasktodo_frontend
    - flutter pub get
    - flutter test --coverage
  artifacts:
    paths:
      - tasktodo_frontend/coverage/lcov.info
  only:
    - main

build_backend:
  stage: build_node
  script:
    - docker login -u "$DOCKER_USERNAME" -p "$DOCKER_PASSWORD"
    - docker build -t $BACKEND_IMAGE ./TaskToDo_Backend
    - docker push $BACKEND_IMAGE
  tags:
    - my-vps

deploy_app:
  stage: deploy
  variables:
    SSH_HOST: "185.44.67.203"
    SSH_USER: "root"
    SSH_PORT: "51821"
  before_script:
    - apk add --no-cache openssh
    - mkdir -p ~/.ssh
    - echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - echo -e "Host *\n\tStrictHostKeyChecking no\n" > ~/.ssh/config
  script:
    - scp -P $SSH_PORT TaskToDo_Backend/docker-compose.yml $SSH_USER@$SSH_HOST:/root/docker-compose.yml
    - ssh -p $SSH_PORT $SSH_USER@$SSH_HOST "
        docker compose -f /root/docker-compose.yml down &&
        docker compose -f /root/docker-compose.yml pull &&
        docker compose -f /root/docker-compose.yml up -d --build
      "
  only:
    - main
  tags:
    - my-vps

pages:
  stage: publish_pages
  dependencies:
    - build_flutter_apk
  script:
    - cp -r tasktodo_frontend/public .
  artifacts:
    paths:
      - public
  only:
    - main
  tags:
    - my-vps