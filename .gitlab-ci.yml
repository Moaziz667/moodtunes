image: docker:latest  # Use Docker image with Docker CLI pre-installed

services:
  - docker:dind        # Docker-in-Docker for building/pushing images (used in build stages if enabled)

                    # Use Docker-in-Docker service to build Docker images inside pipeline

stages:
  - infrastructure                  # Stage to provision infrastructure with Terraform
  - configure_flutter              # Stage to update Flutter app config with backend IP
  - build_flutter_android          # Stage to build Flutter Android APK
  - test                          # Stage to run Flutter tests
  - build_node                    # Stage to build and push backend Docker image
  - deploy                       # Stage to deploy backend app on EC2 instance
  - publish_pages                # Stage to publish APK download page via GitLab Pages
        # Docker deployment to EC2 instance

variables:
  DOCKER_HOST: tcp://docker:2375
  DOCKER_TLS_CERTDIR: ""
  BACKEND_IMAGE: azizhk444/nodejserver
update_flutter_config:
  stage: configure_flutter
  image: alpine:latest                        # Use lightweight Alpine Linux image for scripting
  script:
    - apk add --no-cache curl bash            # Install curl and bash in Alpine
    - export EC2_IP=$(cat ec2_ip.txt)         # Read the EC2 IP from the artifact file
    - sed -i "s|final url = .*|final url = 'http://$EC2_IP:3000/';|" tasktodo_frontend/lib/config.dart  
      # Replace the backend URL in Flutter config with the new EC2 IP dynamically
  artifacts:
    paths:
      - tasktodo_frontend/lib/config.dart     # Save updated config file for next job
  dependencies:
    - terraform_apply                         # Depends on terraform_apply to get ec2_ip.txt
  only:
    - main
  tags:
    - my-vps
build_flutter_apk:
  stage: build_flutter_android
  image: ghcr.io/cirruslabs/flutter:3.32.6  # Flutter SDK image with necessary tools pre-installed
  dependencies:
    - update_flutter_config                   # Use updated Flutter config from previous job
  script:
    - cd tasktodo_frontend                    # Navigate to Flutter frontend directory
    - flutter pub get                         # Fetch Flutter dependencies
    - flutter build apk --release             # Build release APK for Android
    - APK_VERSION="v${CI_PIPELINE_IID}"       # Set APK version based on pipeline ID (unique build number)
    - mv build/app/outputs/flutter-apk/app-release.apk app-$APK_VERSION.apk  # Rename APK with version
    - mkdir -p public/apks                     # Create directory to hold APKs for download page
    - mv app-$APK_VERSION.apk public/apks/    # Move APK to public directory for GitLab Pages
    - |
      echo "<!DOCTYPE html><html><head><title>APK Downloads</title></head><body><h1>APK Versions</h1><ul>" > public/index.html
      for apk in public/apks/app-*.apk; do
        echo "<li><a href='apks/$(basename $apk)'>$(basename $apk)</a></li>" >> public/index.html
      done
      echo "</ul></body></html>" >> public/index.html  # Generate simple HTML page listing APK downloads
  artifacts:
    paths:
      - tasktodo_frontend/public               # Save public directory (APK + index.html) for next stage
  only:
    - main
flutter_test:
  stage: test
  image: ghcr.io/cirruslabs/flutter:3.32.6  # Same Flutter SDK image for tests
  tags:
    - my-vps
  script:
    - cd tasktodo_frontend                    # Move to Flutter frontend directory
    - flutter pub get                         # Get dependencies for tests
    - flutter test --coverage                 # Run tests and collect coverage info
  artifacts:
    paths:
      - tasktodo_frontend/coverage/lcov.info # Save test coverage report as artifact
  only:
    - main

build_backend:
  stage: build_node
  script:
    - docker login -u "$DOCKER_USERNAME" -p "$DOCKER_PASSWORD"  # Log in to Docker registry
    - docker build -t $BACKEND_IMAGE ./TaskToDo_Backend          # Build backend Docker image
    - docker push $BACKEND_IMAGE                                 # Push backend image to Docker registry
  tags:
    - my-vps
  only:
    - main

# --- Terraform: Provision Infrastructure on AWS ---
terraform_apply:
  stage: infrastructure
  image:
    name: hashicorp/terraform:light
    entrypoint: [""]
  variables:
    AWS_ACCESS_KEY_ID: $AWS_ACCESS_KEY_ID
    AWS_SECRET_ACCESS_KEY: $AWS_SECRET_ACCESS_KEY
    AWS_DEFAULT_REGION: $AWS_DEFAULT_REGION
    TF_TOKEN_app_terraform_io: $TF_TOKEN_app_terraform_io
  script:
    - cd TaskToDo_Backend/terraform
    - terraform init
    - terraform apply -auto-approve
    - terraform output -raw instance_public_ip > ../../ec2_ip.txt
  artifacts:
    paths:
      - ec2_ip.txt
  only:
    - main
  tags:
    - my-vps

# --- Deploy App to EC2 with Mounted EBS Volume ---

terraform_apply:
  stage: infrastructure
  image:
    name: hashicorp/terraform:light
    entrypoint: [""]
  variables:
    AWS_ACCESS_KEY_ID: $AWS_ACCESS_KEY_ID
    AWS_SECRET_ACCESS_KEY: $AWS_SECRET_ACCESS_KEY
    AWS_DEFAULT_REGION: $AWS_DEFAULT_REGION
    TF_TOKEN_app_terraform_io: $TF_TOKEN_app_terraform_io
  script:
    - cd TaskToDo_Backend/terraform
    - terraform init
    - terraform apply -auto-approve
    - terraform output -raw instance_public_ip > ../../ec2_ip.txt
  artifacts:
    paths:
      - ec2_ip.txt
  only:
    - main
  tags:
    - my-vps

# --- Deploy App to EC2 with Mounted EBS Volume ---


mount_ebs_volume:
  stage: deploy
  image:
    name: amazon/aws-cli:latest
    entrypoint: [""]
  variables:
    AWS_ACCESS_KEY_ID: $AWS_ACCESS_KEY_ID
    AWS_SECRET_ACCESS_KEY: $AWS_SECRET_ACCESS_KEY
    AWS_DEFAULT_REGION: $AWS_DEFAULT_REGION
  before_script:
    - mkdir -p ~/.ssh
    - echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - echo -e "Host *\n\tStrictHostKeyChecking no\n" > ~/.ssh/config
    - export EC2_IP=$(cat ec2_ip.txt)
    - export AWS_REGION="eu-north-1"
    - aws sts get-caller-identity --region $AWS_REGION
    - export VOLUME_ID=$(aws ec2 describe-volumes --filters Name=tag:Name,Values=mongo-ebs-volume --query 'Volumes[0].VolumeId' --region $AWS_REGION --output text)
    - export INSTANCE_ID=$(aws ec2 describe-instances --filters "Name=ip-address,Values=$EC2_IP" --query 'Reservations[0].Instances[0].InstanceId' --region $AWS_REGION --output text)
  script:
    - |
      echo "Checking if volume is attached..."
      ATTACHMENT_STATE=$(aws ec2 describe-volumes \
        --volume-ids $VOLUME_ID \
        --query "Volumes[0].Attachments[0].State" \
        --output text \
        --region $AWS_REGION 2>/dev/null || echo "detached")

      if [ "$ATTACHMENT_STATE" = "attached" ]; then
        echo "Detaching volume..."
        aws ec2 detach-volume --volume-id $VOLUME_ID --region $AWS_REGION
        sleep 10
      else
        echo "Volume is already detached. Skipping detach."
      fi

    - |
      echo "Attaching volume..."
      aws ec2 attach-volume --volume-id $VOLUME_ID --instance-id $INSTANCE_ID --device /dev/xvdf --region $AWS_REGION || echo "Already attached or in use"
  artifacts:
    paths:
      - ec2_ip.txt
  only:
    - main
  tags:
    - my-vps

setup_and_deploy_app:
  stage: deploy
  image: ubuntu:22.04
  before_script:
    - apt update && apt install -y curl openssh-client sudo docker.io unzip
    - curl -L "https://github.com/docker/compose/releases/latest/download/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
    - chmod +x /usr/local/bin/docker-compose
    - mkdir -p ~/.ssh
    - echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - echo -e "Host *\n\tStrictHostKeyChecking no\n" > ~/.ssh/config
    - export EC2_IP=$(cat ec2_ip.txt)
  script:
    - ssh ubuntu@$EC2_IP "
        set -e;
        sudo mkdir -p /mnt/mongo-data;
        if ! blkid /dev/xvdf1; then sudo mkfs -t ext4 /dev/xvdf || true; fi;
        sudo mount /dev/xvdf /mnt/mongo-data || true;
        echo '/dev/xvdf /mnt/mongo-data ext4 defaults,nofail 0 2' | sudo tee -a /etc/fstab;
        sudo chown -R ubuntu:ubuntu /mnt/mongo-data;

        sudo apt-get update -y;
        sudo apt-get install -y docker.io curl;
        sudo systemctl enable --now docker;
        sudo usermod -aG docker ubuntu;

        sudo curl -L \"https://github.com/docker/compose/releases/latest/download/docker-compose-\$(uname -s)-\$(uname -m)\" -o /usr/local/bin/docker-compose;
        sudo chmod +x /usr/local/bin/docker-compose;
      "
    - scp TaskToDo_Backend/docker-compose.yml ubuntu@$EC2_IP:/home/ubuntu/
    - ssh ubuntu@$EC2_IP "cd /home/ubuntu && docker-compose down && docker-compose pull && docker-compose up -d --remove-orphans"
  dependencies:
    - terraform_apply
  only:
    - main
  tags:
    - my-vps




