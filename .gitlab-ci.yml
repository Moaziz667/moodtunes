image: docker:latest  # Use Docker image with Docker CLI pre-installed

services:
  - docker:dind        # Docker-in-Docker for building/pushing images (used in build stages if enabled)

stages:
  - infrastructure     # Terraform infra provisioning
  - deploy             # Docker deployment to EC2 instance

variables:
  DOCKER_HOST: tcp://docker:2375
  DOCKER_TLS_CERTDIR: ""
  BACKEND_IMAGE: azizhk444/nodejserver

# --- Terraform: Provision Infrastructure on AWS ---
terraform_apply:
  stage: infrastructure
  image:
    name: hashicorp/terraform:light
    entrypoint: [""]
  variables:
    AWS_ACCESS_KEY_ID: $AWS_ACCESS_KEY_ID
    AWS_SECRET_ACCESS_KEY: $AWS_SECRET_ACCESS_KEY
    AWS_DEFAULT_REGION: $AWS_DEFAULT_REGION
    TF_TOKEN_app_terraform_io: $TF_TOKEN_app_terraform_io
  script:
    - cd TaskToDo_Backend/terraform
    - terraform init
    - terraform apply -auto-approve
    - terraform output -raw instance_public_ip > ../../ec2_ip.txt
  artifacts:
    paths:
      - ec2_ip.txt
  only:
    - main
  tags:
    - my-vps

# --- Deploy App to EC2 with Mounted EBS Volume ---

deploy_app:
  image: amazon/aws-cli:latest
  stage: deploy
  services:
    - docker:dind
  variables:
    AWS_ACCESS_KEY_ID: $AWS_ACCESS_KEY_ID
    AWS_SECRET_ACCESS_KEY: $AWS_SECRET_ACCESS_KEY
    AWS_DEFAULT_REGION: $AWS_DEFAULT_REGION
  script:
    # Debug: Confirm AWS variables exist
    - echo "Checking AWS env vars..."
    - aws sts get-caller-identity || { echo '❌ AWS credentials are invalid'; exit 1; }

    # Get EC2 IP
    - echo "📦 Reading EC2 IP from file..."
    - cat ec2_ip.txt || { echo "❌ ec2_ip.txt missing"; exit 1; }
    - export EC2_IP=$(cat ec2_ip.txt)
    - if [ -z "$EC2_IP" ]; then echo "❌ EC2_IP is empty"; exit 1; fi
    - echo "✅ EC2_IP = $EC2_IP"

    # Get EC2 instance ID using IP
    - echo "🔍 Getting EC2 instance ID..."
    - export INSTANCE_ID=$(aws ec2 describe-instances --filters "Name=ip-address,Values=$EC2_IP" --query 'Reservations[0].Instances[0].InstanceId' --output text)
    - if [ -z "$INSTANCE_ID" ] || [ "$INSTANCE_ID" == "None" ]; then echo "❌ Failed to get EC2 instance ID"; exit 1; fi
    - echo "✅ Instance ID = $INSTANCE_ID"

    # Mount EBS volume to EC2 via SSH
    - echo "🔗 SSH into EC2 and mount EBS volume..."
    - |
      ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa ubuntu@$EC2_IP <<'EOF'
        set -e
        echo "📁 Creating mount point..."
        sudo mkdir -p /mnt/mongo-data

        echo "🧪 Checking volume format..."
        if ! sudo blkid /dev/xvdf; then
          echo "🔧 Formatting volume..."
          sudo mkfs -t ext4 /dev/xvdf
        fi

        echo "📦 Mounting volume..."
        sudo mount /dev/xvdf /mnt/mongo-data || true
        sudo chown -R ubuntu:ubuntu /mnt/mongo-data

        echo "📝 Adding to fstab..."
        echo '/dev/xvdf /mnt/mongo-data ext4 defaults,nofail 0 2' | sudo tee -a /etc/fstab
      EOF


  dependencies:
    - terraform_apply
  only:
    - main
  tags:
    - my-vps


