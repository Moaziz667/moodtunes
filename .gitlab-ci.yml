image: docker:latest                  # Use Docker image with Docker CLI pre-installed

services:
  - docker:dind                      # Use Docker-in-Docker service to build Docker images inside pipeline

stages:
  - infrastructure                  # Stage to provision infrastructure with Terraform
  - configure_flutter              # Stage to update Flutter app config with backend IP
  - build_flutter_android          # Stage to build Flutter Android APK
  - test                          # Stage to run Flutter tests
  - build_node                    # Stage to build and push backend Docker image
  - deploy                       # Stage to deploy backend app on EC2 instance
  - publish_pages                # Stage to publish APK download page via GitLab Pages

variables:
  DOCKER_HOST: tcp://docker:2375  # Docker daemon TCP address for Docker-in-Docker
  DOCKER_TLS_CERTDIR: ""           # Disable TLS cert directory for Docker daemon (required for DinD)
  BACKEND_IMAGE: azizhk444/nodejserver  # Docker image base name
  IMAGE_TAG: $CI_PIPELINE_IID      # Use pipeline ID as image tag for traceability

