image: docker:latest  # Use Docker image with Docker CLI pre-installed

services:
  - docker:dind        # Docker-in-Docker for building/pushing images (used in build stages if enabled)

stages:
  - infrastructure     # Terraform infra provisioning
  - deploy             # Docker deployment to EC2 instance

variables:
  DOCKER_HOST: tcp://docker:2375
  DOCKER_TLS_CERTDIR: ""
  BACKEND_IMAGE: azizhk444/nodejserver

# --- Terraform: Provision Infrastructure on AWS ---
terraform_apply:
  stage: infrastructure
  image:
    name: hashicorp/terraform:light
    entrypoint: [""]
  variables:
    AWS_ACCESS_KEY_ID: $AWS_ACCESS_KEY_ID
    AWS_SECRET_ACCESS_KEY: $AWS_SECRET_ACCESS_KEY
    AWS_DEFAULT_REGION: $AWS_DEFAULT_REGION
    TF_TOKEN_app_terraform_io: $TF_TOKEN_app_terraform_io
  script:
    - cd TaskToDo_Backend/terraform
    - terraform init
    - terraform apply -auto-approve
    - terraform output -raw instance_public_ip > ../../ec2_ip.txt
  artifacts:
    paths:
      - ec2_ip.txt
  only:
    - main
  tags:
    - my-vps

# --- Deploy App to EC2 with Mounted EBS Volume ---

terraform_apply:
  stage: infrastructure
  image:
    name: hashicorp/terraform:light
    entrypoint: [""]
  variables:
    AWS_ACCESS_KEY_ID: $AWS_ACCESS_KEY_ID
    AWS_SECRET_ACCESS_KEY: $AWS_SECRET_ACCESS_KEY
    AWS_DEFAULT_REGION: $AWS_DEFAULT_REGION
    TF_TOKEN_app_terraform_io: $TF_TOKEN_app_terraform_io
  script:
    - cd TaskToDo_Backend/terraform
    - terraform init
    - terraform apply -auto-approve
    - terraform output -raw instance_public_ip > ../../ec2_ip.txt
  artifacts:
    paths:
      - ec2_ip.txt
  only:
    - main
  tags:
    - my-vps

# --- Deploy App to EC2 with Mounted EBS Volume ---


mount_ebs_volume:
  stage: deploy
  image:
    name: amazon/aws-cli:latest
    entrypoint: [""]
  variables:
    AWS_ACCESS_KEY_ID: $AWS_ACCESS_KEY_ID
    AWS_SECRET_ACCESS_KEY: $AWS_SECRET_ACCESS_KEY
    AWS_DEFAULT_REGION: $AWS_DEFAULT_REGION
  before_script:
    - mkdir -p ~/.ssh
    - echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - echo -e "Host *\n\tStrictHostKeyChecking no\n" > ~/.ssh/config
    - export EC2_IP=$(cat ec2_ip.txt)
    - export AWS_REGION="eu-north-1"
    - aws sts get-caller-identity --region $AWS_REGION
    - export VOLUME_ID=$(aws ec2 describe-volumes --filters Name=tag:Name,Values=mongo-ebs-volume --query 'Volumes[0].VolumeId' --region $AWS_REGION --output text)
    - export INSTANCE_ID=$(aws ec2 describe-instances --filters "Name=ip-address,Values=$EC2_IP" --query 'Reservations[0].Instances[0].InstanceId' --region $AWS_REGION --output text)
  script:
    - |
      echo "Checking if volume is attached..."
      ATTACHMENT_STATE=$(aws ec2 describe-volumes \
        --volume-ids $VOLUME_ID \
        --query "Volumes[0].Attachments[0].State" \
        --output text \
        --region $AWS_REGION 2>/dev/null || echo "detached")

      if [ "$ATTACHMENT_STATE" = "attached" ]; then
        echo "Detaching volume..."
        aws ec2 detach-volume --volume-id $VOLUME_ID --region $AWS_REGION
        sleep 10
      else
        echo "Volume is already detached. Skipping detach."
      fi

    - |
      echo "Attaching volume..."
      aws ec2 attach-volume --volume-id $VOLUME_ID --instance-id $INSTANCE_ID --device /dev/xvdf --region $AWS_REGION || echo "Already attached or in use"
  artifacts:
    paths:
      - ec2_ip.txt
  only:
    - main
  tags:
    - my-vps

setup_and_deploy_app:
  stage: deploy
  image: ubuntu:22.04
  before_script:
    - apt update && apt install -y curl openssh-client sudo docker.io unzip
    - curl -L "https://github.com/docker/compose/releases/latest/download/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
    - chmod +x /usr/local/bin/docker-compose
    - mkdir -p ~/.ssh
    - echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - echo -e "Host *\n\tStrictHostKeyChecking no\n" > ~/.ssh/config
    - export EC2_IP=$(cat ec2_ip.txt)
  script:
    - ssh ubuntu@$EC2_IP "
        set -e
        sudo mkdir -p /mnt/mongo-data
        if ! blkid /dev/xvdf1; then sudo mkfs -t ext4 /dev/xvdf || true; fi
        sudo mount /dev/xvdf /mnt/mongo-data || true
        echo '/dev/xvdf /mnt/mongo-data ext4 defaults,nofail 0 2' | sudo tee -a /etc/fstab
        sudo chown -R ubuntu:ubuntu /mnt/mongo-data

        sudo apt-get update -y
        sudo apt-get install -y docker.io curl
        sudo systemctl enable --now docker
        sudo usermod -aG docker ubuntu

        sudo curl -L \"https://github.com/docker/compose/releases/latest/download/docker-compose-\$(uname -s)-\$(uname -m)\" -o /usr/local/bin/docker-compose
        sudo chmod +x /usr/local/bin/docker-compose
      "
    - scp TaskToDo_Backend/docker-compose.yml ubuntu@$EC2_IP:/home/ubuntu/
    - ssh ubuntu@$EC2_IP "cd /home/ubuntu && docker-compose down && docker-compose pull && docker-compose up -d --remove-orphans"
  dependencies:
    - terraform_apply
  only:
    - main
  tags:
    - my-vps



