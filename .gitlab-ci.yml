image: docker:latest

services:
  - docker:dind

stages:
  - build_flutter_android
  - build_node
  - deploy

variables:
  DOCKER_HOST: tcp://docker:2375
  DOCKER_TLS_CERTDIR: ""
  BACKEND_IMAGE: azizhk444/nodejserver

