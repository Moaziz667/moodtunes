pages:
  stage: publish_pages
  image: alpine:latest
  # dependencies:
  #   - build_flutter_apk                           # Depends on APK build artifacts
  before_script:
    - apk add --no-cache curl unzip               # Install minimal tools
  script:
    # Create public directory structure
    - mkdir -p public/apks /tmp/old_apks
    
    # Fetch ALL previous APK versions from published GitLab Pages URL
    - |
      echo "🔍 Fetching ALL previous APK versions from GitLab Pages..."
      PAGES_URL="https://${CI_PROJECT_NAMESPACE}.gitlab.io/${CI_PROJECT_NAME}"
      
      # Try to fetch existing index.html
      if curl -Ls "${PAGES_URL}/index.html" -o old_index.html 2>/dev/null; then
        echo "✅ Found published pages, extracting ALL APK links..."
        
        # Extract ALL APK links from HTML (matches: apks/app-*.apk)
        grep -Eo 'apks/app-[^"]+\.apk' old_index.html | sort -u > apk_list.txt 2>/dev/null || true
        
        if [ -s apk_list.txt ]; then
          echo "📦 Found $(wc -l < apk_list.txt) APK file(s) to download"
          
          # Download each old APK
          while IFS= read -r apk_path; do
            apk_name=$(basename "$apk_path")
            echo "⬇️  Downloading ${apk_name}..."
            
            if curl -LsSf "${PAGES_URL}/${apk_path}" -o "/tmp/old_apks/${apk_name}" 2>/dev/null; then
              echo "   ✅ Success: ${apk_name}"
            else
              echo "   ❌ Failed: ${apk_name}"
            fi
          done < apk_list.txt
          
          OLD_COUNT=$(ls -1 /tmp/old_apks/*.apk 2>/dev/null | wc -l || echo 0)
          echo "✅ Successfully preserved ${OLD_COUNT} old version(s)"
          ls -lh /tmp/old_apks/ 2>/dev/null || true
        else
          echo "ℹ️  No previous APKs found in index.html"
        fi
      else
        echo "ℹ️  No published pages yet. This is the first deployment."
      fi
    
    # Copy old APKs to public directory first
    - |
      if [ -d "/tmp/old_apks" ]; then
        echo "📋 Copying all old APKs to public directory..."
        cp -v /tmp/old_apks/*.apk public/apks/ 2>/dev/null || true
        echo "✅ Old APKs copied"
      fi
    
    # List all APKs we have now
    - |
      echo "📊 Current APKs in public/apks:"
      ls -lh public/apks/ 2>/dev/null || echo "No APKs found"
    
    # Count total versions
    - export TOTAL_VERSIONS=$(ls -1 public/apks/app-*.apk 2>/dev/null | wc -l)
    
    # Generate enhanced index.html with ALL APKs (sorted by version, newest first)
    - |
      cat > public/index.html << 'EOF'
      <!DOCTYPE html>
      <html lang="en">
      <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>📱 APK Downloads</title>
        <style>
          * { margin: 0; padding: 0; box-sizing: border-box; }
          body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
          }
          .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
          }
          .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 40px 30px;
            text-align: center;
          }
          .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
          }
          .header p {
            font-size: 1.1em;
            opacity: 0.9;
          }
          .stats {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-top: 20px;
            padding: 20px;
            background: rgba(255,255,255,0.1);
            border-radius: 10px;
          }
          .stat-item {
            text-align: center;
          }
          .stat-number {
            font-size: 2em;
            font-weight: bold;
          }
          .stat-label {
            font-size: 0.9em;
            opacity: 0.8;
          }
          .content {
            padding: 40px 30px;
          }
          .version-list {
            list-style: none;
          }
          .version-item {
            padding: 20px;
            margin: 15px 0;
            background: #f8f9fa;
            border-radius: 10px;
            border-left: 4px solid #667eea;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.3s ease;
          }
          .version-item:hover {
            transform: translateX(5px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
          }
          .version-item.latest {
            background: linear-gradient(135deg, #d4edda 0%, #c3e6cb 100%);
            border-left-color: #28a745;
          }
          .version-info {
            flex: 1;
          }
          .version-name {
            font-size: 1.2em;
            font-weight: 600;
            color: #333;
            margin-bottom: 5px;
          }
          .version-meta {
            color: #666;
            font-size: 0.9em;
          }
          .badge {
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: 600;
            margin-right: 10px;
          }
          .badge.latest {
            background: #28a745;
            color: white;
          }
          .badge.old {
            background: #6c757d;
            color: white;
          }
          .download-btn {
            padding: 12px 30px;
            background: #667eea;
            color: white;
            text-decoration: none;
            border-radius: 25px;
            font-weight: 600;
            transition: all 0.3s ease;
            display: inline-block;
          }
          .download-btn:hover {
            background: #5568d3;
            transform: scale(1.05);
          }
          .footer {
            text-align: center;
            padding: 20px;
            background: #f8f9fa;
            color: #666;
            font-size: 0.9em;
          }
          .no-versions {
            text-align: center;
            padding: 40px;
            color: #999;
          }
        </style>
      </head>
      <body>
        <div class="container">
          <div class="header">
            <h1>📱 APK Downloads</h1>
            <p>Download your app version</p>
            <div class="stats">
              <div class="stat-item">
                <div class="stat-number">TOTAL_VERSIONS_PLACEHOLDER</div>
                <div class="stat-label">Total Versions</div>
              </div>
              <div class="stat-item">
                <div class="stat-number">#PIPELINE_ID_PLACEHOLDER</div>
                <div class="stat-label">Latest Build</div>
              </div>
            </div>
          </div>
          <div class="content">
            <ul class="version-list">
      EOF
      
      # Replace placeholders
      sed -i "s/TOTAL_VERSIONS_PLACEHOLDER/${TOTAL_VERSIONS}/" public/index.html
      sed -i "s/PIPELINE_ID_PLACEHOLDER/${CI_PIPELINE_IID}/" public/index.html
      
      # List APKs sorted by version number (newest first)
      FIRST=true
      APK_LIST=$(ls -1 public/apks/app-*.apk 2>/dev/null | sort -t'v' -k2 -rn)
      
      if [ -n "$APK_LIST" ]; then
        for apk in $APK_LIST; do
          apk_name=$(basename "$apk")
          apk_size=$(du -h "$apk" | cut -f1)
          
          if [ "$FIRST" = true ]; then
            cat >> public/index.html << EOF
              <li class="version-item latest">
                <div class="version-info">
                  <div class="version-name">
                    <span class="badge latest">🆕 LATEST</span>
                    ${apk_name}
                  </div>
                  <div class="version-meta">Size: ${apk_size} | Pipeline: #${CI_PIPELINE_IID}</div>
                </div>
                <a href="apks/${apk_name}" class="download-btn" download>Download</a>
              </li>
      EOF
            FIRST=false
          else
            cat >> public/index.html << EOF
              <li class="version-item">
                <div class="version-info">
                  <div class="version-name">
                    <span class="badge old">OLD</span>
                    ${apk_name}
                  </div>
                  <div class="version-meta">Size: ${apk_size}</div>
                </div>
                <a href="apks/${apk_name}" class="download-btn" download>Download</a>
              </li>
      EOF
          fi
        done
      else
        echo '<li class="no-versions">No versions available yet.</li>' >> public/index.html
      fi
      
      cat >> public/index.html << 'EOF'
            </ul>
          </div>
          <div class="footer">
            Built with GitLab CI/CD | 🚀 Automated Deployment
          </div>
        </div>
      </body>
      </html>
      EOF
  artifacts:
    paths:
      - public                                    # Publish public folder for GitLab Pages
  only:
    - main
