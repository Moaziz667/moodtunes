#     - flutter build apk --release
#   artifacts:
#     paths:
#       - tasktodo_frontend/build/app/outputs/flutter-apk/app-release.apk

build_backend:
  stage: build_node
  script:
    - docker login -u "$DOCKER_USERNAME" -p "$DOCKER_PASSWORD"
    - docker build -t $BACKEND_IMAGE ./TaskToDo_Backend
    - docker push $BACKEND_IMAGE
  tags:
    - my-vps

deploy_app:
  stage: deploy
  variables:
    SSH_HOST: "185.44.67.203"
    SSH_USER: "root"
    SSH_PORT: "51821"
  before_script:
    - apk add --no-cache openssh
    - mkdir -p ~/.ssh
    - echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - echo -e "Host *\n\tStrictHostKeyChecking no\n" > ~/.ssh/config
  script:
    - scp -P $SSH_PORT docker-compose.yml $SSH_USER@$SSH_HOST:/root/docker-compose.yml
    - ssh -p $SSH_PORT $SSH_USER@$SSH_HOST "
        docker compose -f /root/docker-compose.yml down &&
        docker compose -f /root/docker-compose.yml pull &&
        docker compose -f /root/docker-compose.yml up -d --build
      "
  only:
    - main
  tags:
    - my-vps
