image: docker:latest                  # Use Docker image with Docker CLI pre-installed

services:
  - docker:dind                      # Use Docker-in-Docker service to build Docker images inside pipeline

stages:
  - infrastructure                  # Stage to provision infrastructure with Terraform
  - configure_flutter              # Stage to update Flutter app config with backend IP
  - build_flutter_android          # Stage to build Flutter Android APK
  - test                          # Stage to run Flutter tests
  - build_node                    # Stage to build and push backend Docker image
  - deploy                       # Stage to deploy backend app on EC2 instance
  - publish_pages                # Stage to publish APK download page via GitLab Pages

variables:
  DOCKER_HOST: tcp://docker:2375  # Docker daemon TCP address for Docker-in-Docker
  DOCKER_TLS_CERTDIR: ""           # Disable TLS cert directory for Docker daemon (required for DinD)
  BACKEND_IMAGE: azizhk444/nodejserver  # Docker image base name
  IMAGE_TAG: $CI_PIPELINE_IID      # Use pipeline ID as image tag for traceability

terraform_apply:
  stage: infrastructure
  image:
    name: hashicorp/terraform:light # Terraform official image (lightweight)
    entrypoint: [""]                # Override entrypoint for terraform CLI commands
  variables:
    TF_TOKEN_app_terraform_io: $TF_TOKEN_app_terraform_io  # Terraform Cloud API token (seul variable nécessaire)
  script:
    - cd backend/terraform             # Move into Terraform config directory
    - terraform init                            # Initialize Terraform (download providers, modules)
    - terraform apply -auto-approve            # Apply Terraform config, auto-approve without prompt
    - terraform output -raw alb_dns_name > ../../alb_dns.txt    # Extract ALB DNS name
    - terraform output -raw asg_name > ../../asg_name.txt       # Extract ASG name
    - terraform output -raw mongodb_connection_string > ../../mongo_uri.txt  # Extract Atlas URI
  artifacts:
    paths:
      - alb_dns.txt                            # Save ALB DNS as artifact
      - asg_name.txt                           # Save ASG name as artifact
      - mongo_uri.txt                          # Save MongoDB Atlas URI as artifact
  only:
    - main                                    # Run this job only on main branch

update_flutter_config:
  stage: configure_flutter
  image: alpine:latest                        # Use lightweight Alpine Linux image for scripting
  script:
    - apk add --no-cache curl bash            # Installl curl and bash in Alpine
    - export ALB_DNS=$(cat alb_dns.txt)       # Read the ALB DNS from the artifact file
    - sed -i "s|final url = .*|final url = 'http://$ALB_DNS/';|" frontend/lib/config.dart  
      # Replace the backend URL in Flutter config with ALB DNS (port 80, no need to specify)
  artifacts:
    paths:
      - frontend/lib/config.dart     # Save updated config file for next job
  dependencies:
    - terraform_apply                         # Depends on terraform_apply to get alb_dns.txt
  only:
    - main

build_flutter_apk:
  stage: build_flutter_android
  image: ghcr.io/cirruslabs/flutter:3.32.6  # Flutter SDK image with necessary tools pre-installed
  dependencies:
    - update_flutter_config                   # Use updated Flutter config from previous job
  cache:
    key: flutter-build-$CI_COMMIT_REF_SLUG
    paths:
      - frontend/.dart_tool/
      - frontend/.pub-cache/
      - frontend/build/
    policy: pull-push
  script:
    - cd frontend                    # Navigate to Flutter frontend directory
    - flutter pub get                         # Fetch Flutter dependencies
    - flutter build apk --release             # Build release APK for Android
    - APK_VERSION="v${CI_PIPELINE_IID}"       # Set APK version based on pipeline ID (unique build number)
    - mv build/app/outputs/flutter-apk/app-release.apk app-$APK_VERSION.apk  # Rename APK with version
    - mkdir -p public/apks                     # Create directory to hold APKs for download page
    - mv app-$APK_VERSION.apk public/apks/    # Move APK to public directory for GitLab Pages
    - |
      echo "<!DOCTYPE html><html><head><title>APK Downloads</title></head><body><h1>APK Versions</h1><ul>" > public/index.html
      for apk in public/apks/app-*.apk; do
        echo "<li><a href='apks/$(basename $apk)'>$(basename $apk)</a></li>" >> public/index.html
      done
      echo "</ul></body></html>" >> public/index.html  # Generate simple HTML page listing APK downloads
  artifacts:
    paths:
      - frontend/public               # Save public directory (APK + index.html) for next stage
  only:
    - main

flutter_test:
  stage: test
  image: ghcr.io/cirruslabs/flutter:3.32.6  # Same Flutter SDK image for tests
  cache:
    key: flutter-build-$CI_COMMIT_REF_SLUG
    paths:
      - frontend/.dart_tool/
      - frontend/.pub-cache/
    policy: pull
  script:
    - cd frontend                    # Move to Flutter frontend directory
    - flutter pub get                         # Get dependencies for tests
    - flutter test --coverage                 # Run tests and collect coverage info
  artifacts:
    paths:
      - frontend/coverage/lcov.info # Save test coverage report as artifact
  only:
    - main

build_backend:
  stage: build_node
  script:
    - docker login -u "$DOCKER_USERNAME" -p "$DOCKER_PASSWORD"  # Log in to Docker registry
    - docker build -t $BACKEND_IMAGE:$IMAGE_TAG ./backend  # Build with version tag
    - docker build -t $BACKEND_IMAGE:latest ./backend      # Also tag as latest
    - docker push $BACKEND_IMAGE:$IMAGE_TAG                         # Push versioned image
    - docker push $BACKEND_IMAGE:latest                             # Push latest tag
  only:
    - main



deploy_staging:
  stage: deploy  # This job runs in the "deploy" stage of the pipeline

  variables:
    SSH_HOST: "185.44.67.203"  # VPS IP address
    SSH_USER: "root"           # SSH user (be cautious using root in production)
    SSH_PORT: "51821"          # Custom SSH port (non-default for security)

  before_script:
  - apk add --no-cache openssh docker-cli    # Install OpenSSH and Docker CLI
  - mkdir -p ~/.ssh                      # Create SSH config directory
  - set +x                              # Disable command echo
  - echo "$SSH_VPS" > ~/.ssh/id_rsa     # Save SSH private key from GitLab CI/CD variable
  - chmod 600 ~/.ssh/id_rsa              # Secure permissions on the private key
  - docker login -u "$DOCKER_USERNAME" -p "$DOCKER_PASSWORD"  # Login to Docker registry
  - set -x                              # Re-enable command echo
  - echo -e "Host *\n\tStrictHostKeyChecking no\n" > ~/.ssh/config  # Disable strict host key checking
  - export MONGODB_URI=$(cat mongo_uri.txt)  # Read Atlas URI from artifact

  script:
    # Upload the staging Docker Compose file to the VPS using secure copy (SCP)
    - scp -P $SSH_PORT backend/docker-compose.staging.yml $SSH_USER@$SSH_HOST:/root/docker-compose.yml

    # SSH into the server and run Docker Compose with Atlas URI
    - ssh -p $SSH_PORT $SSH_USER@$SSH_HOST "
        export IMAGE_TAG=$IMAGE_TAG &&
        export MONGODB_URI='$MONGODB_URI' &&
        docker compose -f /root/docker-compose.yml down &&
        docker compose -f /root/docker-compose.yml pull &&
        docker compose -f /root/docker-compose.yml up -d
      "

  dependencies:
    - terraform_apply  # Need mongo_uri.txt artifact

  only:
    - main  # Run this job only on the main branch

  environment:
    name: staging  # Declare this job as a deployment to the 'staging' environment

  



deploy_app:
  stage: deploy
  image: 
    name: amazon/aws-cli:latest
    entrypoint: [""]                          # Override entrypoint for AWS CLI
  variables:
    AWS_ACCESS_KEY_ID: $AWS_ACCESS_KEY_ID
    AWS_SECRET_ACCESS_KEY: $AWS_SECRET_ACCESS_KEY
    AWS_DEFAULT_REGION: $AWS_DEFAULT_REGION
  before_script:
    - yum install -y jq || true               # Install jq for JSON parsing
    - export ASG_NAME=$(cat asg_name.txt)     # Read ASG name from artifact
    - export MONGODB_URI=$(cat mongo_uri.txt) # Read Atlas URI from artifact
  script:
    # Trigger ASG instance refresh to deploy new version
    - |
      echo "Starting ASG instance refresh for $ASG_NAME..."
      aws autoscaling start-instance-refresh \
        --auto-scaling-group-name "$ASG_NAME" \
        --preferences '{"MinHealthyPercentage": 0, "InstanceWarmup": 120}' \
        --strategy Rolling
    # Wait for refresh to complete with TIMEOUT (max 10 minutes)
    - |
      echo "Waiting for instance refresh to complete (timeout: 10 min)..."
      TIMEOUT=600
      ELAPSED=0
      while [ $ELAPSED -lt $TIMEOUT ]; do
        STATUS=$(aws autoscaling describe-instance-refreshes \
          --auto-scaling-group-name "$ASG_NAME" \
          --query 'InstanceRefreshes[0].Status' \
          --output text)
        echo "[$ELAPSED s] Current status: $STATUS"
        if [ "$STATUS" = "Successful" ]; then
          echo "✅ Instance refresh completed successfully!"
          exit 0
        elif [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ]; then
          echo "❌ Instance refresh failed! Checking instance health..."
          aws autoscaling describe-instance-refreshes \
            --auto-scaling-group-name "$ASG_NAME" \
            --query 'InstanceRefreshes[0].StatusReason' \
            --output text
          exit 1
        fi
        sleep 20
        ELAPSED=$((ELAPSED + 20))
      done
      echo "⏰ Timeout reached! Cancelling instance refresh..."
      aws autoscaling cancel-instance-refresh --auto-scaling-group-name "$ASG_NAME" || true
      exit 1
  dependencies:
    - terraform_apply                         # Need asg_name.txt and mongo_uri.txt
    - build_backend                           # Need new Docker image pushed first
  only:
    - main
  environment:
    name: production
    url: http://$ALB_DNS
  when: manual                                # Manual deployment trigger
  needs:
    - deploy_staging
    - terraform_apply
    - build_backend 

pages:
  stage: publish_pages
  image: alpine:latest
  dependencies:
    - build_flutter_apk                           # Depends on APK build artifacts
  before_script:
    - apk add --no-cache curl jq                  # Install curl and jq for API calls
  script:
    # Create public directory structure
    - mkdir -p public/apks
    
    # Robustly fetch existing APKs from prior GitLab Pages deployment (follows redirects, clearer logs)
    - |
      echo "Fetching existing APKs from GitLab Pages..."
      PAGES_URL="https://${CI_PROJECT_NAMESPACE}.gitlab.io/${CI_PROJECT_NAME}"
      STATUS=$(curl -Ls -o old_index.html -w "%{http_code}" "${PAGES_URL}/index.html" || echo 000)
      if [ "$STATUS" = "200" ] || [ "$STATUS" = "302" ] || [ "$STATUS" = "301" ]; then
        echo "Existing Pages found (HTTP $STATUS). Extracting previous APK links..."
        # Extract APK filenames from old index (supports app-v<id>.apk or app-<any>.apk)
        PREV_APKS=$(grep -Eo 'apks/app-[^"\s]+' old_index.html | sed 's/\"//g' | sort -u)
        if [ -n "$PREV_APKS" ]; then
          echo "$PREV_APKS" | while read apk_path; do
            apk_name=$(basename "$apk_path")
            if [ -f "public/apks/${apk_name}" ]; then
              echo "Skipping already present ${apk_name}"
            else
              echo "Downloading ${apk_name} from ${PAGES_URL}/${apk_path}..."
              curl -LsSf "${PAGES_URL}/${apk_path}" -o "public/apks/${apk_name}" || echo "Failed to download ${apk_name}"
            fi
          done
        else
          echo "No prior APK links found in existing index.html."
        fi
      else
        echo "Pages not reachable (HTTP ${STATUS}). Proceeding with fresh deployment."
      fi
    
    # Copy new APK from build artifacts
    - cp -r frontend/public/apks/* public/apks/ 2>/dev/null || true
    
    # Generate index.html with ALL APKs (sorted by version, newest first)
    - |
      echo "<!DOCTYPE html>
      <html>
      <head>
        <title> APK Downloads</title>
        <style>
          body { font-family: Arial, sans-serif; max-width: 800px; margin: 50px auto; padding: 20px; }
          h1 { color: #333; }
          ul { list-style: none; padding: 0; }
          li { padding: 10px; margin: 5px 0; background: #f5f5f5; border-radius: 5px; }
          a { color: #0066cc; text-decoration: none; }
          a:hover { text-decoration: underline; }
          .latest { background: #d4edda; border-left: 4px solid #28a745; }
          .version { color: #666; font-size: 0.9em; }
        </style>
      </head>
      <body>
        <h1>📱 APK Downloads</h1>
        <p>Download the Android app below. Latest version is highlighted.</p>
        <ul>" > public/index.html
      
      # List APKs sorted by version number (newest first). If no vNNN pattern, fallback to name sort.
      FIRST=true
      APK_LIST=$(ls -1 public/apks/app-*.apk 2>/dev/null | sort -t'v' -k2 -rn)
      for apk in $APK_LIST; do
        apk_name=$(basename "$apk")
        if [ "$FIRST" = true ]; then
          echo "<li class='latest'>🆕 <a href='apks/${apk_name}'>${apk_name}</a> <span class='version'>(Latest)</span></li>" >> public/index.html
          FIRST=false
        else
          echo "<li><a href='apks/${apk_name}'>${apk_name}</a></li>" >> public/index.html
        fi
      done
      
      echo "</ul>
        <hr>
        <p><small>Built with GitLab CI/CD | Pipeline #${CI_PIPELINE_IID}</small></p>
      </body>
      </html>" >> public/index.html
  artifacts:
    paths:
      - public                                    # Publish public folder for GitLab Pages
  only:
    - main
