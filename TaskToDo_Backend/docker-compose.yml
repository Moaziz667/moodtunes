version: "3.8"

services:
  mongo:
    image: mongo:6.0
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - /mnt/mongo-data:/data/db   # Use EBS mount for MongoDB data persistence

  backend:
    image: azizhk444/nodejserver
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - mongo
    environment:
      MONGODB_URI: mongodb://mongo:27017/TaskToDo
